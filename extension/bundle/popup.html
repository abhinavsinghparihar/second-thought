<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Second Thought</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell" id="shell" data-theme="light">
    <!-- ── header ─────────────────────────────────────────────────────── -->
    <header class="masthead">
      <div class="masthead__brand">
        <span class="masthead__mark" id="brand-mark"></span>
        <span class="masthead__name">Second Thought</span>
      </div>
      <button class="icon-btn" id="open-options" title="Settings" aria-label="Open settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </header>

    <!-- ── this site ──────────────────────────────────────────────────── -->
    <section class="site" aria-labelledby="site-label">
      <div class="site__head">
        <span class="st-eyebrow" id="site-label">Current tab</span>
        <span class="chip" id="site-status">Checking…</span>
      </div>
      <div class="site__name" id="site-name">—</div>
      <p class="site__note" id="site-note"></p>
    </section>

    <!-- ── primary action ─────────────────────────────────────────────── -->
    <button class="cta" id="refine-draft">
      <span class="cta__label">Review current draft</span>
      <svg class="cta__arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </button>
    <p class="cta-note" id="cta-note">Complete requests pass through untouched.</p>

    <hr class="st-rule" />

    <!-- ── engine ────────────────────────────────────────────────────── -->
    <section class="engine" aria-labelledby="engine-label">
      <div class="row-head">
        <span class="st-eyebrow" id="engine-label">Analysis engine</span>
        <button class="link-btn" id="engine-change">Change</button>
      </div>
      <div class="engine__body">
        <div class="engine__title">
          <span class="engine__badge" id="engine-badge">Local</span>
          <span class="engine__name" id="engine-name">On-device requirement engine</span>
        </div>
        <p class="engine__reason" id="engine-reason"></p>
      </div>
    </section>

    <hr class="st-rule" />

    <!-- ── toggles ───────────────────────────────────────────────────── -->
    <section class="toggles" aria-labelledby="controls-label">
      <span class="st-eyebrow st-sr" id="controls-label">Controls</span>
      <label class="toggle-row">
        <span class="toggle-row__text">
          <span class="toggle-row__label">Second Thought</span>
          <span class="toggle-row__sub">Master switch</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="tg-enabled" />
          <span class="switch__track"><span class="switch__knob"></span></span>
        </span>
      </label>
      <label class="toggle-row">
        <span class="toggle-row__text">
          <span class="toggle-row__label">Pause before sending</span>
          <span class="toggle-row__sub">Clarify only when it changes the answer</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="tg-intercept" />
          <span class="switch__track"><span class="switch__knob"></span></span>
        </span>
      </label>
    </section>

    <!-- ── footer ────────────────────────────────────────────────────── -->
    <footer class="foot">
      <a class="foot__link" id="link-privacy" href="#" role="button">Privacy</a>
      <span class="foot__dot">·</span>
      <a class="foot__link" id="link-history" href="#" role="button">History</a>
      <span class="st-spacer"></span>
      <span class="foot__ver" id="foot-ver"></span>
    </footer>

    <!-- transient message -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
