<style>
  /* preview chrome only — not part of the product */

  }

<body>
<div class="preview-note"><b>UI preview</b><span>Popup · 332px width · shown with demo settings</span></div>
<div class="preview-stage">
  <div class="shell" id="shell" data-theme="light">
    <!-- ── header ─────────────────────────────────────────────────────── -->
    <header class="masthead">
      <div class="masthead__brand">
        <span class="masthead__mark" id="brand-mark"></span>
        <span class="masthead__name">Second Thought</span>
      </div>
      <button class="icon-btn" id="open-options" title="Settings" aria-label="Open settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </header>

    <!-- ── this site ──────────────────────────────────────────────────── -->
    <section class="site" aria-labelledby="site-label">
      <div class="site__head">
        <span class="st-eyebrow" id="site-label">Current tab</span>
        <span class="chip" id="site-status">Checking…</span>
      </div>
      <div class="site__name" id="site-name">—</div>
      <p class="site__note" id="site-note"></p>
    </section>

    <!-- ── primary action ─────────────────────────────────────────────── -->
    <button class="cta" id="refine-draft">
      <span class="cta__label">Review current draft</span>
      <svg class="cta__arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </button>
    <p class="cta-note" id="cta-note">Complete requests pass through untouched.</p>

    <hr class="st-rule" />

    <!-- ── engine ────────────────────────────────────────────────────── -->
    <section class="engine" aria-labelledby="engine-label">
      <div class="row-head">
        <span class="st-eyebrow" id="engine-label">Analysis engine</span>
        <button class="link-btn" id="engine-change">Change</button>
      </div>
      <div class="engine__body">
        <div class="engine__title">
          <span class="engine__badge" id="engine-badge">Local</span>
          <span class="engine__name" id="engine-name">On-device requirement engine</span>
        </div>
        <p class="engine__reason" id="engine-reason"></p>
      </div>
    </section>

    <hr class="st-rule" />

    <!-- ── toggles ───────────────────────────────────────────────────── -->
    <section class="toggles" aria-labelledby="controls-label">
      <span class="st-eyebrow st-sr" id="controls-label">Controls</span>
      <label class="toggle-row">
        <span class="toggle-row__text">
          <span class="toggle-row__label">Second Thought</span>
          <span class="toggle-row__sub">Master switch</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="tg-enabled" />
          <span class="switch__track"><span class="switch__knob"></span></span>
        </span>
      </label>
      <label class="toggle-row">
        <span class="toggle-row__text">
          <span class="toggle-row__label">Pause before sending</span>
          <span class="toggle-row__sub">Clarify only when it changes the answer</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="tg-intercept" />
          <span class="switch__track"><span class="switch__knob"></span></span>
        </span>
      </label>
    </section>

    <!-- ── footer ────────────────────────────────────────────────────── -->
    <footer class="foot">
      <a class="foot__link" id="link-privacy" href="#" role="button">Privacy</a>
      <span class="foot__dot">·</span>
      <a class="foot__link" id="link-history" href="#" role="button">History</a>
      <span class="st-spacer"></span>
      <span class="foot__ver" id="foot-ver"></span>
    </footer>

    <!-- transient message -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  </div>

<script>
/* ── minimal chrome extension API stub, in-memory ─────────────────────────── */
(function () {
  const sync = {
    settings: {
      enabled: true, autoIntercept: true, analysisEngine: 'ai',
      aiProvider: 'gemini', aiModel: 'gemini-2.0-flash',
      maxQuestions: 4, adaptiveFollowUp: true, historyEnabled: false,
      excludedSites: [], customSites: [], theme: 'system', onboarded: true
    }
  };
  const local = { 'apiKey:gemini': { key: 'AIza-DEMO-KEY-NOT-REAL-0000', savedAt: Date.now() - 86400000, hint: '0000' } };
  const session = { analyses: {} };
  const listeners = [];

  const area = (store) => ({
    get(keys, cb) {
      const result = {};
      if (keys === null || keys === undefined) Object.assign(result, store);
      else if (typeof keys === 'string') { if (keys in store) result[keys] = store[keys]; }
      else if (Array.isArray(keys)) keys.forEach((k) => { if (k in store) result[k] = store[k]; });
      else Object.keys(keys).forEach((k) => { result[k] = k in store ? store[k] : keys[k]; });
      const p = Promise.resolve(result);
      if (cb) p.then(cb);
      return p;
    },
    set(items, cb) {
      Object.assign(store, items);
      listeners.forEach((fn) => fn({}, 'sync'));
      const p = Promise.resolve();
      if (cb) p.then(cb);
      return p;
    },
    remove(keys, cb) {
      (Array.isArray(keys) ? keys : [keys]).forEach((k) => delete store[k]);
      const p = Promise.resolve();
      if (cb) p.then(cb);
      return p;
    }
  });

  const KEYS = ['gemini', 'openai', 'anthropic', 'openrouter', 'ollama'];
  const PROVIDERS = {

    anthropic: { name: 'Anthropic', defaultModel: 'claude-3-5-haiku-latest', models: ['claude-3-5-haiku-latest','claude-3-5-sonnet-latest'], keyUrl: 'https://console.anthropic.com/settings/keys', needsKey: true, transport: 'Your request text is sent from this browser directly to Anthropic, never to us.' },
    openrouter: { name: 'OpenRouter', defaultModel: 'openai/gpt-4o-mini', models: ['openai/gpt-4o-mini','anthropic/claude-3.5-haiku'], keyUrl: 'https://openrouter.ai/keys', needsKey: true, transport: 'Your request text is sent from this browser directly to OpenRouter, never to us.' },
    ollama: { name: 'Ollama (local)', defaultModel: 'llama3.1', models: ['llama3.1','llama3.2','qwen2.5'], needsKey: false, transport: 'Runs entirely on your machine. Nothing leaves your computer.' }
  };

  function engineStatus(s) {
    if (s.analysisEngine !== 'ai') return { engine: 'local', aiReady: false, providerName: PROVIDERS[s.aiProvider].name, model: s.aiModel, reason: 'Local analysis is on-device and needs no API key.' };
    const has = Boolean(local['apiKey:' + s.aiProvider]);
    if (!has) return { engine: 'local', aiReady: false, providerName: PROVIDERS[s.aiProvider].name, model: s.aiModel, reason: 'No API key saved for ' + PROVIDERS[s.aiProvider].name + ' — using local analysis.' };
    return { engine: 'ai', aiReady: true, providerName: PROVIDERS[s.aiProvider].name, model: s.aiModel };
  }

  window.chrome = {
    runtime: {
      id: 'preview',
      getManifest: () => ({ version: '0.3.0' }),
      openOptionsPage: () => { window.location.href = 'options.html'; },
      onMessage: { addListener() {} },
      sendMessage(message) {
        const s = sync.settings;
        switch (message.type) {
          case 'st/settings-get': {
            const keys = {};
            KEYS.forEach((id) => {
              const rec = local['apiKey:' + id];
              keys[id] = rec ? { hasKey: true, savedAt: rec.savedAt, hint: rec.hint } : { hasKey: false, savedAt: 0, hint: '' };
            });
            return Promise.resolve({ settings: s, keys, engineStatus: engineStatus(s) });
          }
          case 'st/settings-set':
            Object.assign(s, message.settings);
            return Promise.resolve({ settings: s });
          case 'st/key-set':
            local['apiKey:' + message.provider] = { key: message.apiKey, savedAt: Date.now(), hint: message.apiKey.slice(-4) };
            return Promise.resolve({ ok: true, hasKey: true, savedAt: Date.now(), hint: message.apiKey.slice(-4) });
          case 'st/key-clear':
            delete local['apiKey:' + message.provider];
            return Promise.resolve({ ok: true, hasKey: false });
          case 'st/key-clear-all':
            KEYS.forEach((id) => delete local['apiKey:' + id]);
            return Promise.resolve({ ok: true });
          case 'st/test-connection':
            return Promise.resolve({ ok: true, message: 'Connected to ' + PROVIDERS[message.provider].name + ' (' + message.model + ') in 412 ms.', latencyMs: 412 });
          case 'st/history-list':
            return Promise.resolve({ history: [
              { id: 'h1', createdAt: Date.now() - 3600e3, providerId: 'software', original: 'Build me a really cool app.', refinedPrompt: '…', scoreBefore: 31, scoreAfter: 74, taskType: 'software', engine: 'ai' },
              { id: 'h2', createdAt: Date.now() - 86400e3, providerId: 'website', original: 'I need a website for my bakery', refinedPrompt: '…', scoreBefore: 22, scoreAfter: 68, taskType: 'website', engine: 'local' }
            ] });
          case 'st/history-clear':
            return Promise.resolve({ ok: true });
          default:
            return Promise.resolve({ ok: true });
        }
      }
    },
    storage: { sync: area(sync), local: area(local), session: area(session), onChanged: { addListener(fn) { listeners.push(fn); } } },
    tabs: { query: () => Promise.resolve([{ id: 1, url: 'https://chatgpt.com/c/abc' }]), sendMessage: () => Promise.reject(new Error('preview')) },
    scripting: { getRegisteredContentScripts: () => Promise.resolve([]), registerContentScripts: () => Promise.resolve(), unregisterContentScripts: () => Promise.resolve() },
    permissions: { contains: () => Promise.resolve(false), request: () => Promise.resolve(true) }
  };
  window.matchMedia = window.matchMedia || (() => ({ matches: false, addEventListener() {}, removeEventListener() {} }));
})();

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--st-bg);
  color: var(--st-fg);
  font-family: var(--st-font);
  font-size: var(--st-text-base);
  letter-spacing: var(--st-tracking-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  margin: 0;
  font-weight: 700;
  letter-spacing: var(--st-tracking-heading);
  line-height: 1.05;
}
p { margin: 0; }
a { color: inherit; text-decoration: none; }

/* Eyebrow label \u2014 the site's .mono.k */
.st-eyebrow {
  font-family: var(--st-font-mono);
  font-size: var(--st-text-xs);
  text-transform: uppercase;
  letter-spacing: var(--st-tracking-label);
  color: var(--st-fg-muted);
  font-weight: 500;
}

.st-h1 { font-size: var(--st-text-2xl); font-weight: 800; letter-spacing: -0.06em; line-height: 0.92; }
.st-h2 { font-size: var(--st-text-xl); font-weight: 700; letter-spacing: var(--st-tracking-heading); }
.st-h3 { font-size: var(--st-text-lg); font-weight: 700; letter-spacing: -0.03em; }
.st-muted { color: var(--st-fg-muted); }
.st-subtle { color: var(--st-fg-subtle); font-size: var(--st-text-sm); line-height: 1.5; }

/* Hairline \u2014 the site's structural device */
.st-rule { height: 1px; background: var(--st-line); border: 0; margin: 0; }

/* \u2500\u2500 buttons \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.st-btn {
  appearance: none;
  border: 1px solid var(--st-line-strong);
  background: transparent;
  color: var(--st-fg);
  font-family: inherit;
  font-size: var(--st-text-base);
  font-weight: 600;
  letter-spacing: -0.01em;
  border-radius: var(--st-radius-pill);
  padding: 9px 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 36px;
  transition: background var(--st-dur-fast) var(--st-ease),
              color var(--st-dur-fast) var(--st-ease),
              border-color var(--st-dur-fast) var(--st-ease),
              opacity var(--st-dur-fast) var(--st-ease);
  white-space: nowrap;
}
.st-btn:hover { background: var(--st-bg-subtle); border-color: var(--st-fg-faint); }
.st-btn:active { transform: translateY(0.5px); }
.st-btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
.st-btn:focus-visible { outline: 2px solid var(--st-focus); outline-offset: 2px; }

.st-btn--primary {
  background: var(--st-accent);
  color: var(--st-accent-fg);
  border-color: var(--st-accent);
}
.st-btn--primary:hover { background: var(--st-accent); opacity: 0.86; border-color: var(--st-accent); }

.st-btn--ghost { border-color: transparent; color: var(--st-fg-muted); padding-inline: 10px; }
.st-btn--ghost:hover { color: var(--st-fg); background: var(--st-bg-subtle); }

.st-btn--danger { color: var(--st-danger); border-color: var(--st-line); }
.st-btn--danger:hover { background: var(--st-danger-bg); border-color: var(--st-danger); }

.st-btn--sm { font-size: var(--st-text-sm); padding: 6px 13px; min-height: 30px; }
.st-btn--block { width: 100%; }

/* \u2500\u2500 inputs \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.st-input, .st-select, .st-textarea {
  width: 100%;
  font-family: inherit;
  font-size: var(--st-text-base);
  letter-spacing: var(--st-tracking-body);
  color: var(--st-fg);
  background: var(--st-bg);
  border: 1px solid var(--st-line);
  border-radius: var(--st-radius-md);
  padding: 9px 11px;
  transition: border-color var(--st-dur-fast) var(--st-ease), box-shadow var(--st-dur-fast) var(--st-ease);
}
.st-input::placeholder, .st-textarea::placeholder { color: var(--st-fg-faint); }
.st-input:focus, .st-select:focus, .st-textarea:focus {
  outline: none;
  border-color: var(--st-fg);
  box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
}
:root[data-theme="dark"] .st-input:focus,
:root[data-theme="dark"] .st-select:focus,
:root[data-theme="dark"] .st-textarea:focus,
:host([data-theme="dark"]) .st-input:focus {
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
}
.st-textarea { resize: vertical; line-height: 1.55; min-height: 80px; }
.st-select { cursor: pointer; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 16px) calc(50% + 1px), calc(100% - 11px) calc(50% + 1px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 32px;
}

.st-field { display: flex; flex-direction: column; gap: 6px; }
.st-field__label { font-size: var(--st-text-sm); font-weight: 650; color: var(--st-fg); letter-spacing: -0.01em; }
.st-field__hint { font-size: var(--st-text-xs); color: var(--st-fg-subtle); line-height: 1.5; }

/* \u2500\u2500 chips \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.st-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: var(--st-text-xs);
  font-weight: 650;
  font-family: var(--st-font-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 3px 9px;
  border-radius: var(--st-radius-pill);
  border: 1px solid var(--st-line);
  color: var(--st-fg-muted);
  background: var(--st-bg);
  white-space: nowrap;
}
.st-chip--solid { background: var(--st-accent); color: var(--st-accent-fg); border-color: var(--st-accent); }
.st-chip--ok { color: var(--st-ok); border-color: color-mix(in srgb, var(--st-ok) 35%, transparent); background: var(--st-ok-bg); }
.st-chip--warn { color: var(--st-warn); border-color: color-mix(in srgb, var(--st-warn) 35%, transparent); background: var(--st-warn-bg); }
.st-chip--danger { color: var(--st-danger); border-color: color-mix(in srgb, var(--st-danger) 35%, transparent); background: var(--st-danger-bg); }

.st-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

/* \u2500\u2500 utility \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.st-row { display: flex; align-items: center; gap: var(--st-space-2); }
.st-spacer { flex: 1; }
.st-stack { display: flex; flex-direction: column; }
.st-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes st-fade-up {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
@keyframes st-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes st-spin { to { transform: rotate(360deg); } }
@keyframes st-draw { to { stroke-dashoffset: 0; } }
@keyframes st-pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes st-scan {
  0% { transform: translateY(-100%); opacity: 0; }
  20% { opacity: 0.5; }
  100% { transform: translateY(400%); opacity: 0; }
}
@keyframes st-pulse-line {
  0%, 100% { opacity: 0.25; }
  50% { opacity: 1; }
}
